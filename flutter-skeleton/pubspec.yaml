name: stock_esat
description: Gestion de stock accessible pour ESAT (atelier Hygiène & Propreté)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1      # state management
  go_router: ^14.2.0           # navigation
  supabase_flutter: ^2.5.6     # base de données + RLS
  mobile_scanner: ^5.1.1       # scan QR / code-barres
  uuid: ^4.4.0                 # client_key (idempotence offline)
  vibration: ^2.0.0            # retour haptique
  flutter_tts: ^4.0.2          # synthèse vocale (optionnel)
  cached_network_image: ^3.3.1 # photos produits
  image_picker: ^1.1.2         # prise de photo (caméra) — compression intégrée

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
